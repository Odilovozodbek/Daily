<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e7a">
  <meta name="color-scheme" content="light dark">
  <title>Kunlik Reja</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ikonkalar to'plami (SVG sprite). Ishlatilishi: <svg class="ico"><use href="#i-code"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h13"/></symbol>
      <symbol id="i-dumbbell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></symbol>
      <symbol id="i-coffee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3v3M12 3v3"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
      <symbol id="i-hourglass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
    </defs>
  </svg>

  <main class="app">

    <!-- Yuqori qism: logo, soat, sana va keyingi vazifa -->
    <header class="hero">
      <div class="hero-top">
        <div class="brand">
          <img class="logo" src="img/logo.svg" alt="" width="36" height="36">
          <span>Kunlik reja</span>
        </div>
        <div class="hero-tools">
          <button class="notify" type="button" id="notifyBtn" aria-pressed="false" title="Vazifa vaqti kelganda eslatish">
            <svg class="ico"><use href="#i-bell"/></svg>
            <span id="notifyText">Eslatma</span>
          </button>
          <div class="clock mono" id="clock" role="timer" aria-label="Hozirgi vaqt">--:--</div>
        </div>
      </div>
      <h1 class="date" id="dateTitle">Bugun</h1>
      <p class="next-up" id="nextUp"></p>
      <img class="hero-img" src="img/hero.svg" alt="" width="320" height="220">
    </header>

    <!-- Kunlar bo'yicha o'tish -->
    <nav class="daynav" aria-label="Kunlar">
      <button class="nav-btn" type="button" id="prevDay" aria-label="Oldingi kun"><svg class="ico"><use href="#i-left"/></svg></button>
      <button class="nav-today" type="button" id="todayBtn">Bugun</button>
      <button class="nav-btn" type="button" id="nextDay" aria-label="Keyingi kun"><svg class="ico"><use href="#i-right"/></svg></button>
    </nav>

    <!-- Kun natijalari -->
    <section class="stats" aria-label="Kun natijalari">
      <div class="ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="ring">
        <svg viewBox="0 0 90 90" aria-hidden="true">
          <circle class="ring-bg" cx="45" cy="45" r="38"/>
          <circle class="ring-fg" id="ringFg" cx="45" cy="45" r="38"/>
        </svg>
        <span class="ring-num mono" id="ringNum">0%</span>
      </div>
      <ul class="stat-list">
        <li class="stat s-done"><svg class="ico"><use href="#i-check"/></svg><span><b id="stDone">0 / 0</b> bajarildi</span></li>
        <li class="stat s-plan"><svg class="ico"><use href="#i-clock"/></svg><span><b id="stPlan">0 daq</b> rejalangan</span></li>
        <li class="stat s-left"><svg class="ico"><use href="#i-hourglass"/></svg><span><b id="stLeft">0 daq</b> qolgan</span></li>
      </ul>
    </section>

    <div class="cols">
      <!-- Vazifa qo'shish formasi -->
      <form class="panel form" id="taskForm" novalidate>
        <h2 id="formTitle"><svg class="ico"><use href="#i-plus"/></svg><span>Yangi vazifa</span></h2>

        <div class="field">
          <label for="title">Nima qilasiz?</label>
          <input id="title" name="title" type="text" maxlength="80" autocomplete="off" placeholder="Masalan: JavaScript mashqlari">
        </div>

        <div class="pair">
          <div class="field">
            <label for="start">Boshlanishi</label>
            <input id="start" name="start" type="time">
          </div>
          <div class="field">
            <label for="end">Tugashi</label>
            <input id="end" name="end" type="time">
          </div>
        </div>

        <fieldset class="cats">
          <legend>Turi</legend>
          <label class="cat-opt cat-kod"><input type="radio" name="cat" value="kod" checked><span><svg class="ico"><use href="#i-code"/></svg>Dasturlash</span></label>
          <label class="cat-opt cat-dars"><input type="radio" name="cat" value="dars"><span><svg class="ico"><use href="#i-book"/></svg>Dars</span></label>
          <label class="cat-opt cat-sport"><input type="radio" name="cat" value="sport"><span><svg class="ico"><use href="#i-dumbbell"/></svg>Sport</span></label>
          <label class="cat-opt cat-dam"><input type="radio" name="cat" value="dam"><span><svg class="ico"><use href="#i-coffee"/></svg>Dam olish</span></label>
          <label class="cat-opt cat-boshqa"><input type="radio" name="cat" value="boshqa"><span><svg class="ico"><use href="#i-star"/></svg>Boshqa</span></label>
        </fieldset>

        <p class="error" id="formError" role="alert"></p>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="submitBtn">Qo'shish</button>
          <button class="btn" type="button" id="cancelBtn" hidden>Bekor qilish</button>
        </div>
      </form>

      <!-- Kun jadvali -->
      <section class="panel" aria-labelledby="listTitle">
        <h2 id="listTitle"><svg class="ico"><use href="#i-flag"/></svg><span>Kun jadvali</span></h2>
        <ol class="list" id="list"></ol>
        <div class="foot"><button class="link" type="button" id="clearSamples" hidden>Namuna vazifalarni o'chirish</button></div>
      </section>
    </div>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
